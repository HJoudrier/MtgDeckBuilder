const PAGE=200;
function parseMtgoList(txt){
  const out=new Map();
  let section='deck';
  String(txt).replace(/^\uFEFF/,'').split(/\r?\n/).forEach(raw=>{
    let l=raw.replace(/\t+/g,' ').trim();
    if(!l||/^(\/\/|#)/.test(l)) return;
    const entete=l.match(/^(deck|sideboard|commander|companion|maybeboard|tokens?)\s*:?\s*$/i);
    if(entete){ const h=entete[1].toLowerCase();
      section=h==='commander'?'commandant':(h==='deck'?'deck':'reserve'); return; }
    l=l.replace(/^sb:\s*/i,'');
    const m=l.match(/^(\d+)\s*[xX]?\s+(.+)$/);
    let qty=1,nm=l;
    if(m){ qty=parseInt(m[1],10)||1; nm=m[2]; }
    nm=nm.replace(/\s*[\(\[][^\)\]]*[\)\]].*$/,'')   // (SET) 123, [SET]
         .replace(/\s*\*[^*]*\*\s*$/,'')                // marqueur foil *F*
         .replace(/\s*<[^>]*>\s*$/,'')
         .trim();
    // cartes recto-verso et cartes coupées : « A//B », « A / B », « A|B » deviennent « A // B »
    nm=nm.replace(/\s*(?:\/\/|\||\/)\s*/g,' // ').replace(/\s{2,}/g,' ').trim();
    if(!nm) return;
    const k=norm(nm);
    const dejaVu=out.get(k);
    out.set(k,{name:nm,qty:(dejaVu?dejaVu.qty:0)+Math.max(1,qty),section:dejaVu?dejaVu.section:section});
  });
  return [...out.values()];
}
function mergeInto(card,canonical){
  // la carte existe déjà sous son nom exact : on fusionne les quantités
  const q=S.collection.get(card.name)||0, d=S.deck.get(card.name)||0;
  if(q) S.collection.set(canonical.name,(S.collection.get(canonical.name)||0)+q);
  if(d) S.deck.set(canonical.name,(S.deck.get(canonical.name)||0)+d);
  S.collection.delete(card.name); S.deck.delete(card.name);
  const i=DB.indexOf(card); if(i>=0) DB.splice(i,1);
  unindexCard(card);
  if(S.commander===card.name) S.commander=canonical.name;
  if(S.selected===card.name) S.selected=canonical.name;
  return canonical;
}
function renameCard(card,newName){
  if(card.name===newName) return card;
  const existing=BY_NAME[norm(newName)];
  if(existing&&existing!==card) return mergeInto(card,existing);
  const old=card.name;
  unindexCard(card);
  card.name=newName; indexCard(card);
  [S.collection,S.deck].forEach(m=>{ if(m.has(old)){ m.set(newName,(m.get(newName)||0)+m.get(old)); m.delete(old); } });
  if(S.commander===old) S.commander=newName;
  if(S.selected===old) S.selected=newName;
  return card;
}
function frontFace(n){ return String(n||'').split(' // ')[0].trim(); }
function scryTarget(sc,map){
  const keys=[sc.name,frontFace(sc.name)];
  if(sc.card_faces) sc.card_faces.forEach(f=>keys.push(f.name));
  for(const k of keys){
    if(!k) continue;
    const c=BY_NAME[norm(k)]||LOOSE[loose(k)]||FRONT[loose(k)]||(map&&(map.get(norm(k))||map.get(loose(k))));
    if(c) return c;
  }
  return null;
}
function applyScryfall(sc,requested,imagesOnly){
  const faces=sc.card_faces&&sc.card_faces.length?sc.card_faces:null;
  const cost=(sc.mana_cost&&sc.mana_cost.length?sc.mana_cost:(faces?(faces[0].mana_cost||''):''))||'—';
  const type=sc.type_line||(faces?faces[0].type_line:'Inconnu');
  const text=faces&&!sc.oracle_text
    ? faces.map(f=>(f.oracle_text||'').replace(/\n/g,' // ')).join(' // ')
    : (sc.oracle_text||'').replace(/\n/g,' // ');
  const pr=sc.prices||{};
  const price=parseFloat(pr.eur||pr.eur_foil||pr.usd||0)||0;
  const uris=sc.image_uris||(faces&&faces[0]&&faces[0].image_uris)||null;
  let target=(requested&&typeof requested==='object')?requested
            :(BY_NAME[norm(sc.name)]||LOOSE[loose(sc.name)]||(requested?find(requested):null));
  if(target&&(imagesOnly||!target.unknown)){
    if(uris){ target.img=uris.small||uris.normal; target.imgN=uris.normal||uris.large||target.img; }
    if(sc.purchase_uris&&sc.purchase_uris.cardmarket) target.cmUrl=sc.purchase_uris.cardmarket;
    if(pr.eur) target.price=parseFloat(pr.eur)||target.price;   // tendance Cardmarket du jour
    const pw=sc.power||(faces&&faces[0]&&faces[0].power);
    if(pw!=null&&/^\d+$/.test(String(pw))) target.force=+pw;
    return true;
  }
  const fresh=buildCard(sc.name,cost,type,price,text);
  if(Array.isArray(sc.color_identity)) fresh.identity=sc.color_identity.slice();
  if(typeof sc.cmc==='number') fresh.cmc=sc.cmc;
  const pw=sc.power||(faces&&faces[0]&&faces[0].power);
  if(pw!=null&&/^\d+$/.test(String(pw))) fresh.force=+pw;
  if(!target){ if(uris){ fresh.img=uris.small||uris.normal; fresh.imgN=uris.normal||uris.large||fresh.img; }
    registerCard(fresh); return true; }
  target=renameCard(target,sc.name);
  Object.assign(target,fresh,{name:target.name});
  if(uris){ target.img=uris.small||uris.normal; target.imgN=uris.normal||uris.large||target.img; }
  if(sc.purchase_uris&&sc.purchase_uris.cardmarket) target.cmUrl=sc.purchase_uris.cardmarket;
  target.unknown=false;
  return true;
}
const imgQueue=[]; let imgBusy=false;
function queueImages(cards){
  if(!S.images||S.imagesFailed||typeof fetch!=='function') return;
  cards.forEach(c=>{ if(!c.img&&!c.imgTried&&!c.unknown){ c.imgTried=true; imgQueue.push(c.name); } });
  if(imgQueue.length&&!imgBusy) runImageQueue();
}
async function runImageQueue(){
  imgBusy=true;
  while(imgQueue.length&&!S.imagesFailed){
    const chunk=imgQueue.splice(0,75);
    try{
      const r=await fetch('https://api.scryfall.com/cards/collection',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({identifiers:chunk.map(n=>({name:n}))})});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j=await r.json();
      // Scryfall omet les identifiants introuvables : l'ordre ne correspond pas à la requête
      (j.data||[]).forEach(sc=>applyScryfall(sc,scryTarget(sc,null),true));
    }catch(err){
      S.imagesFailed=true; imgBusy=false;
      toast("Visuels indisponibles (hors ligne ou accès bloqué). L'affichage reste en mode texte.");
      renderB(); return;
    }
    renderB(); renderE();
    if(typeof majApercu==='function') majApercu();
    if(typeof scheduleSave==='function') scheduleSave();
    await new Promise(res=>setTimeout(res,90));
  }
  imgBusy=false;
}
async function completeUnknown(names){
  const todo=[...new Set(names)].map(n=>find(n)).filter(c=>c&&c.unknown);
  if(!todo.length){ toast('Aucune carte à compléter.'); return; }
  if(S.enriching){ toast('Complétion déjà en cours.'); return; }
  S.enriching=true;
  toast(`Complétion de ${todo.length} carte(s) via Scryfall, comptez environ ${Math.max(1,Math.ceil(todo.length/75*1.3))} s.`);

  // index des noms demandés : nom complet et face avant, en clair et en forme simplifiée
  const map=new Map();
  todo.forEach(c=>[norm(c.name),loose(c.name),norm(frontFace(c.name)),loose(frontFace(c.name))]
    .forEach(k=>{ if(k&&!map.has(k)) map.set(k,c); }));

  const reste=new Set(todo);
  let ok=0, failed=null;

  async function passe(items,libelle){
    for(let i=0;i<items.length&&!failed;i+=75){
      const chunk=items.slice(i,i+75);
      try{
        const r=await fetch('https://api.scryfall.com/cards/collection',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({identifiers:chunk.map(x=>({name:x.ident}))})});
        if(!r.ok) throw new Error('HTTP '+r.status);
        const j=await r.json();
        (j.data||[]).forEach(sc=>{
          const t=scryTarget(sc,map);
          if(t&&reste.has(t)&&applyScryfall(sc,t)){ ok++; reste.delete(t); }
        });
      }catch(err){ failed=err.message||'réseau indisponible'; return; }
      toast(`${libelle} : ${Math.min(i+75,items.length)} / ${items.length}…`);
      await new Promise(res=>setTimeout(res,90));
    }
  }

  await passe(todo.map(c=>({ident:c.name})),'Complétion');

  // 2e passe : pour une carte recto-verso, Scryfall répond à la face avant seule
  const dfc=[...reste].filter(c=>c.name.includes(' // '));
  if(dfc.length&&!failed) await passe(dfc.map(c=>({ident:frontFace(c.name)})),'Faces avant');

  // 3e passe : recherche tolérante, une carte à la fois, pour les noms mal orthographiés
  const flous=[...reste].slice(0,60);
  for(const c of flous){
    if(failed) break;
    try{
      const r=await fetch('https://api.scryfall.com/cards/named?fuzzy='+encodeURIComponent(frontFace(c.name)));
      if(r.ok){ const sc=await r.json(); if(sc&&sc.name&&applyScryfall(sc,c)){ ok++; reste.delete(c); } }
    }catch(err){ failed=err.message||'réseau indisponible'; break; }
    await new Promise(res=>setTimeout(res,90));
  }

  S.enriching=false;
  renderAll();
  const manquantes=[...reste].map(c=>c.name);
  if(failed) toast(`Complétion interrompue (${failed}). ${ok} carte(s) complétées, les autres restent importées avec des informations minimales.`);
  else toast(`${ok} carte(s) complétées${manquantes.length?` · ${manquantes.length} introuvable(s) : ${manquantes.slice(0,3).join(', ')}${manquantes.length>3?'…':''}`:''}.`);
}
function addToDeck(name){
  const c=find(name); if(!c) return;
  const f=fmt();
  const cur=S.deck.get(name)||0;
  if(!/^Basic Land/i.test(c.type)&&cur>=f.maxCopies){ toast(`${name} : limite de ${f.maxCopies} copie(s) atteinte.`); return; }
  const aPayer=availableFor(c)<=0;
  S.deck.set(name,cur+1);
  if(aPayer){
    const prix=cmEstimate(c);
    toast(`${name} n'est pas dans votre collection : ajoutée au deck et comptée à l'achat${prix?` (≈ ${eur(prix)})`:''}.`);
  }
  if(f.commander&&!S.commander&&c.isLegendaryCreature) S.commander=name;
  renderAll();
}
function deckAdd(card,qty,opts){
  opts=opts||{};
  const f=fmt(); let n=0, achetees=0;
  for(let i=0;i<qty;i++){
    const cur=S.deck.get(card.name)||0;
    if(!opts.force && !/^Basic Land/i.test(card.type) && cur>=f.maxCopies) break;
    if(availableFor(card)<=0){
      // pas d'exemplaire disponible : soit on complète la collection, soit la carte part à l'achat
      if(opts.completer) S.collection.set(card.name,(S.collection.get(card.name)||0)+1);
      else achetees++;
    }
    S.deck.set(card.name,cur+1); n++;
  }
  deckAdd.dernierAchat=achetees;
  return n;
}
function removeFromDeck(name){
  const cur=S.deck.get(name)||0;
  if(cur<=1){ S.deck.delete(name); if(S.commander===name) S.commander=null; } else S.deck.set(name,cur-1);
  renderAll();
}
function buyCard(name){
  if(S.budget.total<=0||S.budget.perCard<=0){ toast('Budget à zéro : aucun achat possible. Augmentez le budget en section F.'); return; }
  const c=find(name); const o=bestOffer(c);
  if(!o){ toast("Aucune offre ne passe vos filtres d'état, de langue ou de prix maximum."); return; }
  if(spent()+o.price>S.budget.total){ toast('Budget dépassé. Augmentez-le, ou retirez une carte à acheter du deck.'); return; }
  deckAdd(c,1,{force:true});
  renderAll();
  toast(`${name} ajoutée au deck, comptée à l'achat : ${eur(o.price)} estimés (${o.condition} ou mieux, ${o.lang}).`);
}

  }
  if(act==='saveWipe'){
    openDialog('Effacer les données locales',
      '<p>La collection, le deck, le panier et les préférences enregistrés dans ce navigateur seront supprimés. L\'atelier repartira de sa collection de démonstration.</p>',
      '<button class="btn" value="cancel">Annuler</button><button class="btn danger" id="okWipeSave" value="ok">Effacer</button>');
    document.getElementById('okWipeSave').onclick=()=>{
      try{ localStorage.removeItem(STORE_KEY); }catch(e){}
      S.collection=new Map(); S.deck=new Map(); S.commander=null;
      S.edhrec={slug:null,status:'idle',data:null,error:null};
      seedCollection();
      setTimeout(()=>{ renderAll(); toast('Données locales effacées.'); },10);
    };
    return;
  }
  if(act==='toggleImages'){ S.images=!S.images; if(S.images) S.imagesFailed=false; renderAll(); return; }
  if(act==='toggleImplicit'){ S.showImplicit=!S.showImplicit; renderD(); return; }
  if(act==='allColors'){ S.colors=new Set(['W','U','B','R','G','C']); S.limitB=PAGE; renderAll(); return; }
  if(act==='noColors'){ S.colors=new Set(); S.limitB=PAGE; renderAll(); return; }
  if(act==='focusCard'){
    const c=find(name);
    S.graphSource='collection'; S.focusNode=c.an.edges.length?c.an.edges[0].to:null;
    document.getElementById('secD').classList.add('open'); renderD();
    document.getElementById('secD').scrollIntoView({behavior:'smooth',block:'start'}); return;
  }
  if(act==='clearDeck'){
    openDialog('Vider le deck','<p>Les cartes retournent dans la collection. Les achats du panier sont annulés.</p>',
      '<button class="btn" value="cancel">Annuler</button><button class="btn danger" id="okClear" value="ok">Vider le deck</button>');
    document.getElementById('okClear').onclick=()=>{ S.deck.clear(); S.commander=null; setTimeout(renderAll,10); };
    return;
  }
  if(act==='wipe'){
    openDialog('Vider la collection',
      `<p>Cette action supprime les <b>${collectionCards().reduce((n,e)=>n+e.qty,0)} exemplaires</b> de la collection ainsi que le deck en cours. Elle est irréversible.</p>`,
      '<button class="btn" value="cancel">Annuler</button><button class="btn danger" id="okWipe" value="ok">Tout supprimer</button>');
    document.getElementById('okWipe').onclick=()=>{ S.collection.clear(); S.deck.clear(); S.commander=null; setTimeout(renderAll,10); };
    return;
  }
  if(act==='import'){ openImport(t.dataset.cible||'collection'); return; }
  if(act==='enrich'){
    completeUnknown(collectionCards().filter(e=>e.card.unknown).map(e=>e.card.name));
    return;
  }
  if(act==='moreB'){ S.limitB+=PAGE; renderB(); return; }
  if(act==='addCard'){ openAdd(t.dataset.cible||'collection'); return; }
  if(act==='ownIt'){
    const c=find(name); if(!c) return;
    const manque=(S.deck.get(name)||0)-(S.collection.get(name)||0);
    if(manque>0){ S.collection.set(name,(S.collection.get(name)||0)+manque); renderAll();
      toast(`${name} ×${manque} ajoutée(s) à la collection : plus rien à acheter pour cette carte.`); }
    return;
  }
  if(act==='deckDrop'){
    const q=S.deck.get(name)||0; if(q){ S.deck.delete(name); if(S.commander===name) S.commander=null; renderAll(); }
    return;
  }
  if(act==='wants'){
    const lines=aAcheter().map(l=>`${l.qty} ${l.card.name}`).join('\n');
    openDialog('Liste de wants Cardmarket',
      `<p class="small muted">À coller dans « Wants list → Ajouter des cartes » sur Cardmarket. Une ligne par carte, quantité puis nom anglais.</p>
       <textarea readonly>${esc(lines)}</textarea>
       <div class="small">Filtres à appliquer sur place : état ${esc(S.budget.condition)} ou mieux, langue ${esc((CM_LANGS.find(l=>l[0]===S.budget.lang)||['','Indifférente'])[1])}, vendeur ${esc((SELLER_TYPES.find(t2=>t2[0]===S.budget.sellerType)||['','Indifférent'])[1])}.</div>
       <a class="btn" href="https://www.cardmarket.com/fr/Magic/Wants" target="_blank" rel="noopener">Ouvrir mes wants lists ↗</a>`,
      '<button class="btn" value="ok">Fermer</button>');
    return;
  }
  if(act==='exportDeck'){
    const entries=deckEntries();
    const cmd=S.commander?entries.filter(e=>e.card.name===S.commander):[];
    const reste=entries.filter(e=>e.card.name!==S.commander);
    const lines=(cmd.length?`Commander\n${cmd.map(e=>`${e.qty} ${e.card.name}`).join('\n')}\n\nDeck\n`:'')
      +reste.map(e=>`${e.qty} ${e.card.name}`).join('\n');
    openDialog('Exporter le deck',`<textarea readonly>${esc(lines||'')}</textarea>
      <div class="small muted">Format MTGO, prêt à être copié.</div>`,'<button class="btn" value="ok">Fermer</button>');
    return;
  }
  if(t.dataset.card){ openCardModal(t.dataset.card); return; }
  if(t.dataset.cardName){ cacherApercu(); openCardModal(t.dataset.cardName); return; }
});

function withFocus(fn){
  const a=document.activeElement, id=a&&a.id;
  let pos=null; try{ pos=a&&a.selectionStart; }catch(e){}
  fn();
  if(id){ const n=document.getElementById(id);
    if(n){ n.focus(); if(pos!=null){ try{ n.setSelectionRange(pos,pos); }catch(e){} } } }
}
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='csbRelay'){ S.csbRelay=t.value.trim(); scheduleSave(); return; }
  if(t.id==='q'){ S.search=t.value; S.limitB=PAGE; withFocus(()=>{renderB();renderC();renderD();renderF();renderTop();}); return; }
  if(t.dataset.cust){ const k=t.dataset.cust;
    S.custom[k]=k==='commander'?t.value==='1':(parseInt(t.value,10)||0); withFocus(renderAll); return; }
  if(t.dataset.lim){ S.custom.colorLimits[t.dataset.lim][t.dataset.side]=parseInt(t.value,10)||0; withFocus(renderE); return; }
  if(t.dataset.bud){ const k=t.dataset.bud;
    S.budget[k]=(k==='total'||k==='perCard')?(parseFloat(t.value)||0):t.value;
    if(k==='total'||k==='perCard') refreshSuggestions();   // sans toucher au champ en cours de saisie
    else { renderF(); renderTop(); }
    scheduleSave(); return; }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.act==='format'){ S.format=t.value;
    if(t.value==='perso'){ S.custom.size=S.custom.size||100; } renderAll(); return; }
  if(t.dataset.act==='chooseCmd'){
    if(!t.value) return;
    if(!peutCommander(find(t.value))){ toast(`${t.value} ne peut pas être commandant.`); return; }
    S.commander=t.value; renderAll(); toast(`${t.value} est désormais le commandant.`); return; }
  if(t.dataset.act==='sort'){ S.sort=t.value; S.limitB=PAGE; renderB(); return; }
  if(t.dataset.bud){ const k=t.dataset.bud;
    S.budget[k]=(k==='total'||k==='perCard')?(parseFloat(t.value)||0):t.value;
    if(k==='total'||k==='perCard') refreshSuggestions(); else { renderF(); renderTop(); }
    scheduleSave(); return; }
  if(t.dataset.act==='typeFilter'){ S.typeFilter=t.value; S.limitB=PAGE; renderB(); renderC(); renderD(); renderF(); return; }
});

/* =====================================================================
   18. PERSISTANCE — stockage local du navigateur, sans serveur ni base
   ===================================================================== */
const STORE_KEY='mtg-atelier-v1';
const storageOK=(()=>{ try{
  localStorage.setItem('__mtg_test','1'); localStorage.removeItem('__mtg_test'); return true;
}catch(e){ return false; } })();
let saveTimer=null, saveState=storageOK?'ok':'off', saveError='', dernierEtatSignale='ok';

function snapshot(){
  // cartes absentes de la base livrée : elles sont conservées intégralement
  const cartes=[], enrich=[];
  DB.forEach(c=>{
    const base=BUILTIN.has(norm(c.name));
    if(base){
      if(c.img||c.cmUrl) enrich.push({n:c.name,p:c.price,g:c.img||'',G:c.imgN||'',u:c.cmUrl||''});
    }else{
      cartes.push({n:c.name,c:c.cost||'—',t:c.type,p:c.price,x:c.text,
        i:(c.identity||[]).join(''),m:c.cmc,f:c.force,g:c.img||'',G:c.imgN||'',u:c.cmUrl||'',k:c.unknown?1:0});
    }
  });
  return {v:1,date:Date.now(),
    collection:[...S.collection], deck:[...S.deck],
    commander:S.commander, colors:[...S.colors], colorMode:S.colorMode,
    format:S.format, custom:S.custom, sort:S.sort, view:S.view, images:S.images,
    graphSource:S.graphSource, showImplicit:S.showImplicit, budget:S.budget, csbRelay:S.csbRelay,
    cartes, enrich};
}
function ecrire(payload){
  localStorage.setItem(STORE_KEY,JSON.stringify(payload));
}
function save(){
  if(!storageOK) return;
  const snap=snapshot();
  try{ ecrire(snap); saveState='ok'; saveError=''; }
  catch(err){
    // quota dépassé : on retente sans les visuels ni les textes des cartes importées
    try{
      const leger={...snap,enrich:[],cartes:snap.cartes.map(c=>({...c,x:'',g:'',G:''}))};
      ecrire(leger); saveState='partiel'; saveError='visuels et textes importés non conservés (espace insuffisant)';
    }catch(err2){
      saveState='plein'; saveError=err2.message||'espace de stockage saturé';
    }
  }
  const p=document.getElementById('savePill'); if(p) p.outerHTML=pillSauvegarde();
  // un échec silencieux serait pire que tout : on prévient une fois par changement d'état
  if(saveState!=='ok'&&saveState!==dernierEtatSignale){
    dernierEtatSignale=saveState;
    toast(saveState==='partiel'
      ? "Espace de stockage limité : les visuels et les textes des cartes importées ne sont pas conservés, les quantités et le deck le restent."
      : "Sauvegarde impossible : le stockage du navigateur est saturé. Exportez un fichier depuis la section A pour ne rien perdre.");
  }
  if(saveState==='ok') dernierEtatSignale='ok';
}
function scheduleSave(){ if(!storageOK) return; clearTimeout(saveTimer); saveTimer=setTimeout(save,700); }

function restore(d){
  if(!d||d.v!==1) return false;
  (d.cartes||[]).forEach(o=>{
    let card=find(o.n);
    if(!card) card=registerCard(buildCard(o.n,o.c||'—',o.t||'Inconnu',o.p||0,o.x||''));
    if(o.i) card.identity=o.i.split('');
    if(typeof o.m==='number') card.cmc=o.m;
    if(typeof o.f==='number') card.force=o.f;
    if(o.g) card.img=o.g; if(o.G) card.imgN=o.G; if(o.u) card.cmUrl=o.u;
    card.unknown=!!o.k;
    if(card.img) card.imgTried=true;
  });
  (d.enrich||[]).forEach(o=>{
    const card=find(o.n); if(!card) return;
    if(o.p) card.price=o.p;
    if(o.g) card.img=o.g; if(o.G) card.imgN=o.G; if(o.u) card.cmUrl=o.u;
    if(card.img) card.imgTried=true;
  });
  S.collection=new Map((d.collection||[]).filter(([n])=>find(n)));
  S.deck=new Map((d.deck||[]).filter(([n])=>find(n)));
  S.commander=d.commander&&find(d.commander)?d.commander:null;
  if(d.colors&&d.colors.length!==undefined) S.colors=new Set(d.colors);
  ['colorMode','format','sort','view','graphSource'].forEach(k=>{ if(d[k]) S[k]=d[k]; });
  if(typeof d.images==='boolean') S.images=d.images;
  if(typeof d.showImplicit==='boolean') S.showImplicit=d.showImplicit;
  if(d.custom) S.custom={...S.custom,...d.custom,colorLimits:{...S.custom.colorLimits,...(d.custom.colorLimits||{})}};
  if(d.budget) S.budget={...S.budget,...d.budget};
  if(typeof d.csbRelay==='string') S.csbRelay=d.csbRelay;
  return true;
}
function chargerSauvegarde(){
  if(!storageOK) return null;
  try{ const raw=localStorage.getItem(STORE_KEY); return raw?JSON.parse(raw):null; }
  catch(err){ saveState='corrompu'; saveError=err.message||''; return null; }
}
function pillSauvegarde(){
  const t={ok:'Sauvegarde locale',partiel:'Sauvegarde allégée',plein:'Sauvegarde saturée',
            off:'Sans sauvegarde',corrompu:'Sauvegarde illisible'}[saveState]||'Sauvegarde';
  const col={ok:'var(--ok)',partiel:'var(--warn)',plein:'var(--bad)',off:'var(--dim2)',corrompu:'var(--bad)'}[saveState];
  return `<span class="pill" id="savePill" title="${esc(saveError||'Les données restent dans ce navigateur, sur cet appareil.')}">
    <span class="dot" style="background:${col}"></span> ${t}</span>`;
}

const sauvegardeInitiale=chargerSauvegarde();
if(!(sauvegardeInitiale&&restore(sauvegardeInitiale))) seedCollection();
renderAll();
loadSymbology();
if(!storageOK) toast("Le stockage du navigateur est bloqué ici : les données ne survivront pas au rechargement. Téléchargez le fichier et ouvrez-le depuis votre disque pour activer la sauvegarde.");
</script>
